<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bùi Bá & Huyền Thương - Wedding</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@200;300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; font-family: 'Montserrat', sans-serif; color: #fff; background-color: #000; }

        .hero {
            position: relative; height: 100%; width: 100%;
            background-image: url('./assets/bk.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 0 20px;
            text-align: center;
        }

        .overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.3));
            z-index: 1;
        }

        /* CINEMATIC TITLE */
        .cinematic-title {
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 1.6s ease-out;
        }

        .save-date-text {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 7px;
            opacity: 0.85;
            font-weight: 300;
        }

        .movie-line {
            font-size: 1.1rem;
            font-weight: 200;
            opacity: 0.9;
            letter-spacing: 1px;
            font-style: italic;
            max-width: 300px;
        }

        /* NAMES LIKE MOVIE POSTER */
        .wreath-container {
            position: relative;
            width: 380px;
            height: 380px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        .wreath-image {
            position: absolute;
            width: 100%; height: 100%; object-fit: contain;
            animation: rotateWreath 60s linear infinite;
            opacity: 0.9;
        }

        .poster-names {
            position: relative;
            z-index: 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transform: translateY(-5px);
        }

        .name-line {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .and-text {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 5px;
            color: #f4e9c9;
            margin: 4px 0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        /* MINI CALENDAR */
        .mini-calendar-wrapper {
            margin-top: auto;
            margin-bottom: 60px;
            z-index: 3;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .mini-calendar-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 14px;
            width: 200px;
            border-radius: 12px;
            color: #333;
            border: 1px solid #d4af37;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3);
            transform: rotate(-2deg);
            transition: 0.3s ease;
        }

        .mini-calendar-container:hover {
            transform: rotate(0deg) scale(1.04);
        }

        .cal-month {
            text-transform: uppercase;
            font-weight: 700;
            color: #d4af37;
            border-bottom: 1px solid #eee;
            margin-bottom: 5px;
        }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .cal-head { font-size: 0.65rem; font-weight: 700; color: #999; }
        .cal-day { padding: 4px 0; font-size: 0.8rem; }

        .cal-day.special {
            background: #d4af37;
            color: #fff;
            font-weight: 700;
            border-radius: 50%;
        }

        /* ANIMATIONS */
        @keyframes fadeIn { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform:translateY(0);} }
        @keyframes rotateWreath { from {transform:rotate(0);} to {transform:rotate(360deg);} }

    </style>
</head>
<body>

<header class="hero">
    <div class="overlay"></div>

    <div class="cinematic-title">
        <div class="save-date-text">SAVE THE DATE</div>
        <div class="movie-line">“Sự gì Thiên Chúa liên kết, loài người không được phân ly.”</div>
    </div>

    <div class="wreath-container">
        <img src="./assets/flower2.png" class="wreath-image">
        <div class="poster-names">
            <div class="name-line">Bùi Bá</div>
            <div class="and-text">&</div>
            <div class="name-line">Huyền Thương</div>
        </div>
    </div>

    <div class="mini-calendar-wrapper">
        <div class="mini-calendar-container">
            <div class="cal-month">Tháng 1 - 2026</div>
            <div class="cal-grid">
                <div class="cal-head">CN</div><div class="cal-head">T2</div><div class="cal-head">T3</div><div class="cal-head">T4</div><div class="cal-head">T5</div><div class="cal-head">T6</div><div class="cal-head">T7</div>
                <div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div>
                <div class="cal-day">1</div><div class="cal-day">2</div><div class="cal-day">3</div>
                <div class="cal-day special">4</div>
                <div class="cal-day">5</div><div class="cal-day">6</div><div class="cal-day">7</div><div class="cal-day">8</div><div class="cal-day">9</div><div class="cal-day">10</div>
            </div>
        </div>
    </div>
</header>

</body>
</html>
